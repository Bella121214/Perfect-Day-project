<!-- =================================
     HAPPY MEMORIES
================================== -->

<div class="happy-memories">

    <h2>Happy Memories</h2>

    <form id="memoryForm">

        <label for="memoryText">
            Memory
        </label>

        <input
            type="text"
            id="memoryText"
            placeholder="What made you happy today?"
            required
        >


        <label for="memoryDate">
            Date
        </label>

        <input
            type="date"
            id="memoryDate"
            required
        >


        <button
            type="submit"
            class="save-btn"
        >
            Save Memory
        </button>

    </form>

</div>
