<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calendar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="top-bar">
            <h1>My Calendar</h1>

            <button id="addItemBtn" class="add-btn">
                + Add Item
            </button>
        </header>

        <section class="calendar-header">

            <button id="previousMonth" class="nav-btn">
                ‹
            </button>

            <h2 id="monthYear"></h2>

            <button id="nextMonth" class="nav-btn">
                ›
            </button>

        </section>

        <section class="calendar">

            <div class="weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <div id="calendarDays" class="calendar-days"></div>

        </section>

    </div>


    <!-- Add Item Window -->

    <div id="modal" class="modal hidden">

        <div class="modal-content">

            <button id="closeModal" class="close-btn">
                ×
            </button>

            <h2>Add Calendar Item</h2>

            <form id="itemForm">

                <label for="itemTitle">
                    Item
                </label>

                <input
                    type="text"
                    id="itemTitle"
                    placeholder="What are you doing?"
                    required
                >


                <label for="itemDate">
                    Date
                </label>

                <input
                    type="date"
                    id="itemDate"
                    required
                >


                <label for="itemTime">
                    Time
                </label>

                <input
                    type="time"
                    id="itemTime"
                    required
                >


                <label for="itemColor">
                    Color
                </label>

                <input
                    type="color"
                    id="itemColor"
                    value="#4f46e5"
                >


                <button type="submit" class="save-btn">
                    Save Item
                </button>

            </form>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
