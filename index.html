<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Perfect Day Calendar</title>
    <!-- Links to your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>☀️ My Perfect Day Calendar</h1>
    </header>

    <!-- Main Container for just the Calendar Planner -->
    <main class="planner-section" style="max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05);">
        <h2>📅 Core: Day Planner</h2>
       
        <!-- The form where you type new activities -->
        <form id="activity-form">
            <input type="time" id="activity-time" required>
            <input type="text" id="activity-text" placeholder="What is your perfect activity?" required>
            <button type="submit">Add to Day</button>
        </form>
       
        <!-- This is where your planned activities will appear -->
        <div id="timeline" class="timeline-container">
            <!-- Temporary text so you know it's ready -->
            <p style="color: #666; font-style: italic; margin-top: 20px;">Your timeline is empty. Add an activity above!</p>
        </div>
    </main>

    <!-- Links to your JavaScript file to make the buttons work -->
    <script src="app.js"></script>
</body>
</html>
