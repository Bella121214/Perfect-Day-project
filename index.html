<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Calendar</title>

<link rel="stylesheet" href="style.css">

</head> <body>
<div class="app">

    <!-- ================================
         TOP BAR
    ================================= -->

    <header class="top-bar">

        <h1>My Calendar</h1>

        <div class="top-buttons">

            <button id="addItemBtn" class="add-btn">
                + Add Item
            </button>

            <button id="randomMemoryBtn" class="memory-btn">
                ♥ Surprise Me
            </button>

        </div>

    </header>


    <!-- ================================
         CALENDAR HEADER
    ================================= -->

    <section class="calendar-header">

        <button id="previousMonth" class="nav-btn">
            ‹
        </button>

        <h2 id="monthYear"></h2>

        <button id="nextMonth" class="nav-btn">
            ›
        </button>

    </section>


    <!-- ================================
         CALENDAR
    ================================= -->

    <section class="calendar">

        <div class="weekdays">

            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>

        </div>

        <div
            id="calendarDays"
            class="calendar-days">
        </div>

    </section>

</div>


<!-- =========================================
     MAIN POPUP / MODAL
========================================== -->

<div id="modal" class="modal hidden">

    <div class="modal-content">

        <button
            id="closeModal"
            class="close-btn"
            type="button">
            ×
        </button>


        <!-- =================================
             ADD CALENDAR ITEM
        ================================== -->

        <div id="itemSection">

            <h2>Add Calendar Item</h2>

            <form id="itemForm">

                <label for="itemTitle">
                    Item
                </label>

                <input
                    type="text"
                    id="itemTitle"
                    placeholder="What are you doing?"
                    required
                >


                <label for="itemDate">
                    Date
                </label>

                <input
                    type="date"
                    id="itemDate"
                    required
                >


                <label for="itemTime">
                    Time
                </label>

                <input
                    type="time"
                    id="itemTime"
                    required
                >


                <label for="itemColor">
                    Color
                </label>

                <input
                    type="color"
                    id="itemColor"
                    value="#f4515f"
                >


                <button
                    type="submit"
                    class="save-btn">
                    Save Item
                </button>

            </form>

        </div>


        <!-- =================================
             HAPPY MEMORIES
        ================================== -->

        <div class="happy-memories">

            <h2>Happy Memories</h2>

            <form id="memoryForm">

                <label for="memoryText">
                    Memory
                </label>

                <input
                    type="text"
                    id="memoryText"
                    placeholder="What made you happy today?"
                    required
                >


                <label for="memoryDate">
                    Date
                </label>

                <input
                    type="date"
                    id="memoryDate"
                    required
                >


                <button
                    type="submit"
                    class="save-btn">
                    Save Memory
                </button>

            </form>

        </div>


        <!-- =================================
             SURPRISE ME MEMORY DISPLAY
        ================================== -->

        <div
            id="surpriseMemory"
            class="surprise-memory hidden">

            <div class="surprise-heart">
                ♥
            </div>

            <h2>A Happy Memory</h2>

            <p id="surpriseMemoryText"></p>

            <p
                id="surpriseMemoryDate"
                class="surprise-memory-date">
            </p>

            <button
                id="anotherMemoryBtn"
                class="save-btn"
                type="button">
                ♥ Another Memory
            </button>

        </div>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="app.js"></script>

</body> </html>
